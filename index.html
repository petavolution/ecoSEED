<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSEED - Ecosystem Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        
        canvas {
            display: block;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .loading h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .loading p {
            font-size: 1rem;
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid white;
            width: 40px;
            height: 40px;
            margin: 1rem auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="loading" class="loading">
        <h1>EcoSEED</h1>
        <p>Harmonics of Living Worlds</p>
        <div class="spinner"></div>
        <p>Loading ecosystem simulation...</p>
    </div>
    
    <script type="module" src="main.js"></script>
    <script>
        // Hide loading screen when the game is initialized
        window.addEventListener('load', () => {
            // Hide loading screen after timeout or when notified by the game
            const loading = document.getElementById('loading');
            
            // Remove loading screen after max 3 seconds
            setTimeout(() => {
                if (loading) {
                    loading.style.opacity = '0';
                    loading.style.transition = 'opacity 0.5s ease-in-out';
                    setTimeout(() => {
                        loading.remove();
                    }, 500);
                }
            }, 3000);
        });
    </script>
</body>

</html>
